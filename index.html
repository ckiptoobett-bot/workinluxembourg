<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work in Luxembourg | International Employment Opportunities</title>
    <!-- EmailJS CDN SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --lux-blue: #00A1DE;
            --lux-red: #ED2939;
            --dark: #0f172a;
            --text: #1e293b;
            --muted: #475569;
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 640px;
        }

        /* View Controller */
        .auth-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85vh;
            text-align: center;
        }

        .main-app-view {
            display: none;
            width: 100%;
        }

        /* Cards & Forms */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            width: 100%;
            text-align: left;
        }

        h1 {
            color: var(--dark);
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--dark);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            background: #fff;
            color: var(--text);
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--lux-blue);
            box-shadow: 0 0 0 3px rgba(0, 161, 222, 0.15);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary {
            background: var(--lux-blue);
            color: white;
        }

        .btn-primary:hover {
            background: #008cc5;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            width: auto;
            padding: 6px 14px;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .switch-text {
            margin-top: 16px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .switch-text a {
            color: var(--lux-blue);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .switch-text a:hover {
            text-decoration: underline;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
            background: var(--card);
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .user-greeting {
            font-weight: 600;
            color: var(--dark);
            font-size: 0.95rem;
        }

        .error-msg {
            color: var(--lux-red);
            font-size: 0.85rem;
            margin-top: 8px;
            text-align: center;
        }

        .success-msg {
            color: #10b981;
            font-size: 0.85rem;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- AUTHENTICATION VIEW (First Screen) -->
        <div id="authView" class="auth-view">
            <div class="card" style="max-width: 420px; margin: 0 auto;">
                
                <!-- Sign In Form -->
                <div id="signinContainer">
                    <h1>Welcome Back</h1>
                    <p class="subtitle">Sign in to access Luxembourg Job Opportunities</p>
                    <form id="signinForm" onsubmit="handleSignIn(event)">
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="signinEmail" required placeholder="name@example.com">
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="signinPassword" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary">Sign In</button>
                        <div id="signinError" class="error-msg"></div>
                    </form>
                    <div class="switch-text">
                        Don't have an account? <a onclick="toggleAuthMode('signup')">Sign Up</a>
                    </div>
                </div>

                <!-- Sign Up Form -->
                <div id="signupContainer" style="display: none;">
                    <h1>Create Account</h1>
                    <p class="subtitle">Register to apply for jobs in Luxembourg</p>
                    <form id="signupForm" onsubmit="handleSignUp(event)">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="signupName" required placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="signupEmail" required placeholder="name@example.com">
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="signupPassword" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary">Sign Up</button>
                        <div id="signupError" class="error-msg"></div>
                        <div id="signupSuccess" class="success-msg"></div>
                    </form>
                    <div class="switch-text">
                        Already have an account? <a onclick="toggleAuthMode('signin')">Sign In</a>
                    </div>
                </div>

            </div>
        </div>

        <!-- MAIN APPLICATION VIEW (Second Screen - Unlocks after Login) -->
        <div id="mainAppView" class="main-app-view">
            
            <div class="top-bar">
                <span class="user-greeting" id="userGreeting">Welcome, User</span>
                <button class="btn btn-danger" onclick="handleLogout()">Sign Out</button>
            </div>

            <div class="card">
                <h1>Work in Luxembourg 2026</h1>
                <p class="subtitle">Complete your verified application form below.</p>
                
                <form id="jobApplicationForm" onsubmit="submitApplication(event)">
                    <div class="form-group">
                        <label>Select Job Category</label>
                        <select id="jobCategory" required>
                            <option value="">-- Choose Category --</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Finance & Banking">Finance & Banking</option>
                            <option value="Engineering">Engineering</option>
                            <option value="Hospitality & Tourism">Hospitality & Tourism</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="General Labor">General Labor</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="applicantPhone" required placeholder="+352 ...">
                    </div>

                    <div class="form-group">
                        <label>Cover Letter / Summary</label>
                        <textarea id="applicantCover" rows="4" required placeholder="Tell us why you are a great fit..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Submit Application</button>
                    <div id="appStatus" style="margin-top: 10px; text-align: center; font-size: 0.9rem;"></div>
                </form>
            </div>

        </div>

    </div>

    <script>
        const API_URL = 'https://luxembourg-backend.onrender.com';

        // Check active session on load
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('lux_user');
            if (savedUser) {
                const user = JSON.parse(savedUser);
                showMainApp(user.name);
            }
        });

        function toggleAuthMode(mode) {
            if (mode === 'signup') {
                document.getElementById('signinContainer').style.display = 'none';
                document.getElementById('signupContainer').style.display = 'block';
            } else {
                document.getElementById('signupContainer').style.display = 'none';
                document.getElementById('signinContainer').style.display = 'block';
            }
        }

        async function handleSignUp(e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const errEl = document.getElementById('signupError');
            const succEl = document.getElementById('signupSuccess');

            errEl.innerText = '';
            succEl.innerText = '';

            try {
                const res = await fetch(`${API_URL}/api/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    succEl.innerText = 'Registration successful! You can now sign in.';
                    setTimeout(() => toggleAuthMode('signin'), 1500);
                } else {
                    errEl.innerText = data.message || 'Registration failed.';
                }
            } catch (err) {
                errEl.innerText = 'Network error connecting to backend.';
            }
        }

        async function handleSignIn(e) {
            e.preventDefault();
            const email = document.getElementById('signinEmail').value;
            const password = document.getElementById('signinPassword').value;
            const errEl = document.getElementById('signinError');

            errEl.innerText = '';

            try {
                const res = await fetch(`${API_URL}/api/signin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('lux_user', JSON.stringify(data.user || { name: email }));
                    showMainApp(data.user ? data.user.name : email);
                } else {
                    errEl.innerText = data.message || 'Invalid credentials.';
                }
            } catch (err) {
                errEl.innerText = 'Network error connecting to backend.';
            }
        }

        function showMainApp(name) {
            document.getElementById('authView').style.display = 'none';
            document.getElementById('mainAppView').style.display = 'block';
            document.getElementById('userGreeting').innerText = `Welcome, ${name}`;
        }

        function handleLogout() {
            localStorage.removeItem('lux_user');
            document.getElementById('mainAppView').style.display = 'none';
            document.getElementById('authView').style.display = 'flex';
        }

        function submitApplication(e) {
            e.preventDefault();
            const statusEl = document.getElementById('appStatus');
            statusEl.style.color = '#10b981';
            statusEl.innerText = 'Application submitted successfully!';
            document.getElementById('jobApplicationForm').reset();
        }
    </script>
</body>
                          </html>
